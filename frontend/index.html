<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conveyor Guard Legacy Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141414;
      color: #eee;
      padding: 20px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    .main {
      display: flex;
      gap: 20px;
    }
    .video {
      flex: 1;
      position: relative;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      min-height: 360px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .side {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #222;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #333;
    }
    h1, h2 { margin: 0 0 10px 0; }
    .status-row {
      font-size: 13px;
      margin-bottom: 6px;
    }
    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2e7d32;
      color: #fff;
      cursor: pointer;
    }
    button.stop { background: #c62828; }
    button.reset { background: #ef6c00; }
    #log-container {
      max-height: 360px;
      overflow-y: auto;
      background: #171717;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .log-item {
      border-bottom: 1px solid #2d2d2d;
      padding: 6px 2px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Conveyor Guard Legacy Dashboard</h1>
    <div class="main">
      <div class="video">
        <video id="webrtc-video" autoplay muted playsinline></video>
        <div id="video-overlay" class="video-overlay">영상 연결 준비 중</div>
      </div>

      <div class="side">
        <div class="card">
          <h2>상태</h2>
          <div class="status-row" id="ws-status">WS: connecting...</div>
          <div class="status-row" id="video-status">VIDEO: idle</div>
          <div class="status-row" id="mode-status">MODE: -</div>
          <div class="status-row" id="risk-status">RISK: -</div>
        </div>

        <div class="card">
          <h2>제어</h2>
          <button id="btn-auto">운전 모드 시작</button>
          <button id="btn-maint">정비 모드 시작</button>
          <button id="btn-stop" class="stop">긴급 정지</button>
          <button id="btn-reset" class="reset">시스템 리셋</button>
        </div>

        <div class="card">
          <h2>로그</h2>
          <div id="log-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.API_BASE_URL || 'http://localhost:8000';
    const WS_BASE_URL = window.WS_BASE_URL || API_BASE_URL.replace(/^http/i, 'ws');
    const EDGE_ID = window.EDGE_ID || 'edge-default';

    const logContainer = document.getElementById('log-container');
    const wsStatusEl = document.getElementById('ws-status');
    const videoStatusEl = document.getElementById('video-status');
    const modeStatusEl = document.getElementById('mode-status');
    const riskStatusEl = document.getElementById('risk-status');
    const videoEl = document.getElementById('webrtc-video');
    const overlayEl = document.getElementById('video-overlay');

    let pc = null;
    let offerTimer = null;
    let iceTimer = null;
    let reconnectTimer = null;
    let retryDelay = 1000;
    const seenCandidates = new Set();

    function addLog(message) {
      const div = document.createElement('div');
      div.className = 'log-item';
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.prepend(div);
    }

    function setVideoStatus(status, text) {
      videoStatusEl.textContent = `VIDEO: ${status}`;
      overlayEl.textContent = text;
      overlayEl.style.display = status === 'connected' ? 'none' : 'flex';
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(`${response.status} ${detail}`);
      }
      return response.json();
    }

    function cleanupPeer() {
      if (offerTimer) clearTimeout(offerTimer);
      if (iceTimer) clearInterval(iceTimer);
      if (reconnectTimer) clearTimeout(reconnectTimer);
      offerTimer = null;
      iceTimer = null;
      reconnectTimer = null;

      if (pc) {
        pc.ontrack = null;
        pc.onicecandidate = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      if (videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach((t) => t.stop());
        videoEl.srcObject = null;
      }
    }

    function scheduleReconnect(reason) {
      cleanupPeer();
      setVideoStatus('reconnecting', '영상 재연결 시도 중...');
      addLog(`Video reconnect scheduled: ${reason}`);
      reconnectTimer = setTimeout(startWebRtc, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 10000);
    }

    async function startWebRtc() {
      cleanupPeer();
      setVideoStatus('waiting_offer', 'Edge 영상 Offer 대기 중');

      const pollOffer = async () => {
        try {
          const { offer } = await api(`/api/signaling/offer?edge_id=${encodeURIComponent(EDGE_ID)}&receiver=browser`);
          if (!offer) {
            offerTimer = setTimeout(pollOffer, 1000);
            return;
          }

          setVideoStatus('connecting', 'WebRTC 연결 중');
          pc = new RTCPeerConnection();
          seenCandidates.clear();

          const stream = new MediaStream();
          videoEl.srcObject = stream;

          pc.ontrack = (event) => {
            const incoming = event.streams?.[0];
            if (incoming) {
              incoming.getTracks().forEach((track) => stream.addTrack(track));
            }
          };

          pc.onicecandidate = async (event) => {
            if (!event.candidate) return;
            try {
              await api('/api/signaling/ice', {
                method: 'POST',
                body: JSON.stringify({
                  edge_id: EDGE_ID,
                  sender: 'browser',
                  receiver: 'edge',
                  candidate: {
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex,
                  },
                }),
              });
            } catch (e) {
              addLog(`local ICE send failed: ${e.message}`);
            }
          };

          pc.onconnectionstatechange = () => {
            const state = pc.connectionState;
            if (state === 'connected') {
              retryDelay = 1000;
              setVideoStatus('connected', '영상 연결됨');
            } else if (['disconnected', 'failed', 'closed'].includes(state)) {
              scheduleReconnect(state);
            }
          };

          await pc.setRemoteDescription(new RTCSessionDescription({
            type: offer.type,
            sdp: offer.sdp,
          }));

          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          await api('/api/signaling/answer', {
            method: 'POST',
            body: JSON.stringify({
              edge_id: EDGE_ID,
              sender: 'browser',
              receiver: 'edge',
              type: answer.type,
              sdp: answer.sdp,
            }),
          });

          iceTimer = setInterval(async () => {
            try {
              const payload = await api(`/api/signaling/ice?edge_id=${encodeURIComponent(EDGE_ID)}&receiver=browser`);
              for (const item of payload.candidates || []) {
                const c = item?.candidate;
                if (!c?.candidate || seenCandidates.has(c.candidate)) continue;
                seenCandidates.add(c.candidate);
                try {
                  await pc.addIceCandidate(c);
                } catch (e) {
                  addLog(`remote ICE add failed: ${e.message}`);
                }
              }
            } catch (e) {
              addLog(`ICE polling failed: ${e.message}`);
            }
          }, 1000);
        } catch (e) {
          setVideoStatus('failed', '영상 연결 실패. Edge 실행 상태와 signaling API를 확인하세요.');
          scheduleReconnect(e.message);
        }
      };

      pollOffer();
    }

    function connectWs() {
      wsStatusEl.textContent = 'WS: connecting...';
      const ws = new WebSocket(`${WS_BASE_URL}/ws/logs`);

      ws.onopen = () => {
        wsStatusEl.textContent = 'WS: connected';
        addLog('WebSocket connected.');
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'STATUS_UPDATE') {
            modeStatusEl.textContent = `MODE: ${msg.data?.operation_mode || '-'}`;
            riskStatusEl.textContent = `RISK: ${msg.data?.risk_level || '-'}`;
          }
          if (msg.type === 'LOG') {
            addLog(`${msg.data?.event_type || 'LOG'}: ${msg.data?.details?.description || ''}`);
          }
        } catch (e) {
          addLog(`WS parse error: ${e.message}`);
        }
      };

      ws.onclose = () => {
        wsStatusEl.textContent = 'WS: disconnected';
        addLog('WebSocket disconnected.');
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        wsStatusEl.textContent = 'WS: error';
      };
    }

    async function sendControl(path) {
      try {
        const result = await api(`${path}?edge_id=${encodeURIComponent(EDGE_ID)}`, { method: 'POST' });
        addLog(result.message || `${path} 성공`);
      } catch (e) {
        addLog(`제어 실패: ${e.message}`);
      }
    }

    document.getElementById('btn-auto').onclick = () => sendControl('/api/control/start_automatic');
    document.getElementById('btn-maint').onclick = () => sendControl('/api/control/start_maintenance');
    document.getElementById('btn-stop').onclick = () => sendControl('/api/control/stop');
    document.getElementById('btn-reset').onclick = () => sendControl('/api/control/reset');

    window.addEventListener('beforeunload', cleanupPeer);

    connectWs();
    startWebRtc();
  </script>
</body>
</html>
