services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    env_file:
      - .env.prod
    environment:
      LOCAL_DB_PATH: ${LOCAL_DB_PATH:-/app/cloud/data/cloud.db}
    volumes:
      - ${CONVEYOR_DATA_DIR:-./.deploy/cloud-data}:/app/cloud/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
        REACT_APP_WS_BASE_URL: ${REACT_APP_WS_BASE_URL:-}
        REACT_APP_EDGE_ID: ${REACT_APP_EDGE_ID:-edge-default}
        REACT_APP_WEBRTC_ICE_SERVERS_JSON: '${REACT_APP_WEBRTC_ICE_SERVERS_JSON:-[{"urls":"stun:stun.l.google.com:19302"}]}'
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      cloud:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    env_file:
      - .env.prod
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM}
      - --lt-cred-mech
      - --fingerprint
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
